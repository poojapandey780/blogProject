
    <div class="col-lg-3 col-md-4 col-sm-6 mb-4" th:each="blog : ${blogs}" th:fragment="blog-cards" xmlns:th="http://www.w3.org/1999/xhtml">

        <div class="card blog-card h-100 shadow-sm border-0">
            <div class="card-body d-flex flex-column">

                <h5 class="card-title" th:text="${blog.title}"></h5>

                <span class="text-muted small">
                    <b th:text="'@' + ${blog.penName}"></b>
                </span>

                <p class="text-muted small mb-2">
                    <i class="fa fa-clock-o"></i>
                    <span th:text="${#temporals.format(blog.createdAt,'dd MMM yyyy')}"></span>
                </p>

                <p class="card-text text-secondary"
                   th:text="${blog.contentPreview} + '...'"></p>

                <div class="d-flex justify-content-between mb-2">
                    <span class="text-danger">
                        <i class="fa fa-heart"></i>
                        <span th:text="${blog.likeCount}"></span>
                    </span>

                    <span>
                        <i class="fa fa-comment"></i>
                        <span th:text="${blog.commentCount}"></span>
                    </span>
                </div>

                <a th:href="@{/blogs/{id}(id=${blog.blogId})}"
                   class="btn btn-outline-primary btn-sm mt-auto">
                    Read Blog
                </a>

            </div>
        </div>
    </div>
