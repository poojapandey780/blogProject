<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Basic -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <link rel="shortcut icon" th:href="@{/images/favicon.png}" type="">
    <title>Create Blog</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.css}" />
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/responsive.css}" />
</head>

<body class="sub_page">

<div class="hero_area">
    <div class="bg-box">
        <img th:src="@{/images/hero-bg.jpg}" alt="">
    </div>
    <div th:replace="fragments/header :: header"></div>
</div>
<div th:if="${successMessage}"
     id="successMsg"
     class="alert alert-success mb-0 ml-3 py-1 px-2 small">
    <span th:text="${successMessage}"></span>
</div>
<div th:if="${errorMessage}"
     id="errorMsg"
     class="alert alert-danger mb-0 ml-3 py-1 px-2 small">
    <span th:text="${errorMessage}"></span>
</div>
<section class="book_section layout_padding">
    <div class="container">

        <div class="heading_container">
            <h2>Create Blog</h2>
        </div>

        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="form_container">

                    <form th:action="@{/user/blog/create}" th:object="${blogDto}"
                          method="post">

                        <!-- Title -->
                        <div class="mb-3">
                            <input type="text"
                                   class="form-control"
                                   placeholder="Blog title"
                                   th:field="*{title}"
                                   required />
                            <small id="titleNameMsg" class="form-text"></small>
                        </div>

                        <!-- Content -->
                        <div class="mb-3">
              <textarea
                        class="form-control"
                        rows="6"
                        placeholder="Write your blog here..."
                        th:field="*{content}"
                        required></textarea>
                        </div>

                        <button type="submit" class="btn btn-warning w-100">
                            Publish Blog
                        </button>

                    </form>

                </div>
            </div>
        </div>

    </div>
</section>

<div th:replace="fragments/footer::footer"></div>

<script th:src="@{/js/jquery-3.4.1.min.js}"></script>
<script th:src="@{/js/bootstrap.js}"></script>
<script th:src="@{/js/custom.js}"></script>
<script th:src="@{/js/blog.js}"></script>

</body>
</html>
