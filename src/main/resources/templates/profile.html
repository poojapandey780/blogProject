<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Basic -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Mobile Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- Site Metas -->
    <meta name="keywords" content="" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <link rel="shortcut icon" th:href="@{/images/favicon.png}" type="">

    <title> Feane </title>

    <!-- bootstrap core css -->
    <link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.css}" />

    <!--owl slider stylesheet -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
    <!-- nice select  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-nice-select/1.1.0/css/nice-select.min.css" integrity="sha512-CruCP+TD3yXzlvvijET8wV5WxxEh5H8P4cmz0RFbKK6FlZ2sYl3AEsKlLPHbniXKSrDdFewhbmBK5skbdsASbQ==" crossorigin="anonymous" />
    <!-- font awesome style -->
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}" />

    <!-- Custom styles for this template -->
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <!-- responsive style -->
    <link rel="stylesheet" th:href="@{/css/responsive.css}" />

</head>
<body class="sub_page">

<div class="hero_area">
    <div class="bg-box">
        <img th:src="@{/images/hero-bg.jpg}" alt="">
    </div>
    <!-- header section strats -->
    <div th:replace = "fragments/header :: header"></div>
    <!-- end header section -->
</div>

<section class="layout_padding bg-light">
    <div class="container">
        <div class="card shadow-sm mb-4">
            <div class="card-body d-flex align-items-center">

                <div class="profile-image-wrapper mr-4">

                    <img th:src="${loggedInUser.profileImage}"
                         class="rounded-circle"
                         width="120" height="120">

                    <span class="edit-icon"
                          data-toggle="modal"
                          data-target="#changeImageModal">
                            <i class="fa fa-camera"></i>
                    </span>

                </div>


                <div>
                    <h4 th:text="${loggedInUser.userName}"></h4>
                    <p class="text-muted mb-1" th:text="${loggedInUser.email}"></p>
                    <span class="badge badge-warning"
                          th:text="${loggedInUser.penName}"></span>
                </div>

            </div>
        </div>
        <div class="card shadow-sm mb-4">
            <div class="card-header">
                <h5>Public Profile</h5>
            </div>

            <div class="card-body">
                <form id="profileForm" method="Post" th:action="@{/user/profile/update/personalInfo}" th:object="${updateUser}" >

                    <div class="form-group">
                        <label>Pen Name</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{penName}">
                        <small id="penNameMsg" class="form-text"></small>
                    </div>

                    <div class="form-group">
                        <label>Bio</label>
                        <textarea class="form-control"
                                  rows="3"
                                  th:field="*{bio}"></textarea>
                    </div>

                    <!-- Button + Success message row -->
                    <div class="d-flex align-items-center mt-3">
                        <button class="btn btn-warning">
                            Save Profile
                        </button>

                        <!-- Success message -->
                        <div id="successMessage" class="alert alert-success mb-0 ml-3 py-1 px-2 small" style="display:none;">
                            Profile saved successfully!
                        </div>
                    </div>

                </form>
            </div>
        </div>
        <div class="card shadow-sm mb-4">
            <div class="card-header">
                <h5>Account Information</h5>
            </div>

            <div class="card-body">
                <form>

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text"
                               class="form-control"
                               th:value="${loggedInUser.userName}">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email"
                               class="form-control"
                               th:value="${loggedInUser.email}" readonly>
                    </div>

                    <button class="btn btn-primary">
                        Update Account
                    </button>

                </form>
            </div>
        </div>
        <div class="card shadow-sm mb-4">
            <div class="card-header">
                <h5>Security</h5>
            </div>

            <div class="card-body">

                <!-- Change password -->
                <form class="mb-4">
                    <h6>Change Password</h6>

                    <input type="password" class="form-control mb-2"
                           placeholder="Current password" th:value="${loggedInUser.password}">

                    <input type="password" class="form-control mb-2"
                           placeholder="New password" >

                    <button class="btn btn-danger btn-sm">
                        Update Password
                    </button>
                </form>

                <hr>

                <!-- 2FA -->
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6>Two-Factor Authentication</h6>
                        <p class="text-muted mb-0">
                            Extra security for your account
                        </p>
                    </div>

                    <button class="btn btn-outline-success btn-sm">
                        Enable 2FA
                    </button>
                </div>

            </div>
        </div>
        <div class="card shadow-sm mb-4">
            <div class="card-header">
                <h5>Preferences</h5>
            </div>

            <div class="card-body">

                <div class="custom-control custom-switch">
                    <input type="checkbox"
                           class="custom-control-input"
                           id="subscribe"
                           checked>
                    <label class="custom-control-label"
                           for="subscribe">
                        Subscribe to email updates
                    </label>
                </div>

            </div>
        </div>
        <div class="card border-danger">
            <div class="card-body text-center">
                <h6 class="text-danger">Danger Zone</h6>

                <button class="btn btn-outline-danger btn-sm">
                    Unsubscribe / Deactivate Account
                </button>
            </div>
        </div>
    </div>
</section>

<!-- footer section -->
<div th:replace="fragments/footer::footer"></div>
<!-- footer section -->

<div class="modal fade" id="changeImageModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Change Profile Picture</h5>
                <button type="button" class="close" data-dismiss="modal">
                    &times;
                </button>
            </div>

            <form th:action="@{/user/profile/update/img}"
                  method="post"
                  enctype="multipart/form-data">

                <div class="modal-body">
                    <input type="file"
                           name="image"
                           class="form-control"
                           accept="image/*"
                           required>
                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-dismiss="modal">
                        Cancel
                    </button>
                    <button class="btn btn-primary">
                        Save
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

<!--query links-->
<!-- jQery -->
<script th:src="@{/js/jquery-3.4.1.min.js}"></script>
<!-- popper js -->
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous">
</script>
<!-- bootstrap js -->
<script th:src="@{/js/bootstrap.js}"></script>
<!-- owl slider -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js">
</script>
<!-- isotope js -->
<script src="https://unpkg.com/isotope-layout@3.0.4/dist/isotope.pkgd.min.js"></script>
<!-- nice select -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-nice-select/1.1.0/js/jquery.nice-select.min.js"></script>
<!-- custom js -->
<script th:src="@{/js/custom.js}"></script>
</body>

</html>
