<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Basic -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Mobile Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- Site Metas -->
    <meta name="keywords" content="" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <link rel="shortcut icon" th:href="@{/images/favicon.png}" type="">

    <title> Feane </title>

    <!-- bootstrap core css -->
    <link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.css}" />

    <!--owl slider stylesheet -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
    <!-- nice select  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-nice-select/1.1.0/css/nice-select.min.css" integrity="sha512-CruCP+TD3yXzlvvijET8wV5WxxEh5H8P4cmz0RFbKK6FlZ2sYl3AEsKlLPHbniXKSrDdFewhbmBK5skbdsASbQ==" crossorigin="anonymous" />
    <!-- font awesome style -->
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}" />

    <!-- Custom styles for this template -->
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <!-- responsive style -->
    <link rel="stylesheet" th:href="@{/css/responsive.css}" />

</head>

<body class="sub_page">

<div class="hero_area">
    <div class="bg-box">
        <img th:src="@{/images/hero-bg.jpg}" alt="">
    </div>
    <!-- header section strats -->
    <div th:replace = "fragments/header :: header"></div>
    <!-- end header section -->
</div>
<!-- feedback messages -->
<div id="errorMessage"
     class="alert alert-danger mb-0 ml-3 py-1 px-2 small"
     style="display:none;">
</div>
<div id="successMessage"
     class="alert alert-success mb-0 ml-3 py-1 px-2 small"
     style="display:none;">
</div>

<section class="book_section layout_padding">
    <div class="container">
        <div class="heading_container">
            <h2>Forgot Password</h2>
            <p class="text-muted">
                Enter your email and we’ll send you a reset link
            </p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="form_container">

                    <form th:action="@{/user/forgotPassword}" method="post" id="forgotPassword">

                        <div class="mb-3">
                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter your registered email"
                                   required />
                        </div>

                        <button type="submit"
                                class="btn btn-warning w-100">
                            Send Reset Link
                        </button>

                    </form>

                    <form th:action="@{/user/verifyOtp}" method="post" id="otpForm" style="display:none;">

                        <div class="mb-3">
                            <input type="text"
                                   name="otp"
                                   class="form-control"
                                   placeholder="Enter OTP"
                                   required />
                        </div>

                        <button type="submit"
                                class="btn btn-warning w-100">
                            Verify OTP
                        </button>

                    </form>

                    <form th:action="@{/user/resetPassword}" method="post"
                          id="resetPasswordForm" style="display:none;">

                        <div class="mb-3">
                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   id="password"
                                   placeholder="New Password"
                                   required />
                        </div>

                        <div class="mb-3">
                            <input type="password"
                                   name="confirmPassword"
                                   class="form-control"
                                   id="confirmPassword"
                                   placeholder="Confirm Password"
                                   required />
                        </div>

                        <button type="submit"
                                class="btn btn-warning w-100">
                            Reset Password
                        </button>

                    </form>


                    <!-- Back to login -->
                    <div class="text-center mt-3">
                        <a th:href="@{/user/login}" class="text-muted">
                            ← Back to Login
                        </a>
                    </div>

                </div>
            </div>
        </div>

    </div>
</section>



<!-- footer section -->
<div th:replace="fragments/footer::footer"></div>
<!-- footer section -->


<!--query links-->
<!-- jQery -->
<script th:src="@{/js/jquery-3.4.1.min.js}"></script>
<!-- popper js -->
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous">
</script>
<!-- bootstrap js -->
<script th:src="@{/js/bootstrap.js}"></script>
<!-- owl slider -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js">
</script>
<!-- isotope js -->
<script src="https://unpkg.com/isotope-layout@3.0.4/dist/isotope.pkgd.min.js"></script>
<!-- nice select -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-nice-select/1.1.0/js/jquery.nice-select.min.js"></script>
<!-- custom js -->
<!--<script th:src="@{/js/custom.js}"></script>-->
<script th:src="@{/js/forgetPassword.js}"></script>
</body>

</html>
